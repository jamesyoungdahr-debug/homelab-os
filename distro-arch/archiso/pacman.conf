#
# /etc/pacman.conf for the homelab-os archiso build
#
# See the pacman.conf(5) manpage for option and repository directives

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Our own local repo (built from AUR: calamares, zfs-dkms, zfs-utils,
# limine-mkinitcpio-hook, limine-entry-tool — none of which are in the
# official repos) — see build-aur-packages.sh and local-repo/ at the repo
# root. SigLevel is TrustAll since these are our own unsigned local builds,
# not a real public repo.
#
# NOTE: this path only needs to resolve during the mkarchiso BUILD (it's
# bind-mounted in at build time — see the build command). It will not
# resolve on the live medium or the installed target afterward, which is
# harmless — pacman just warns about an unreachable repo on future `pacman
# -Sy` runs, it doesn't hard-fail. Worth cleaning up (remove this section
# post-install, or point it at a real published repo) before relying on
# this image long-term.
[homelab]
SigLevel = Optional TrustAll
Server = file:///homelab-local-repo
