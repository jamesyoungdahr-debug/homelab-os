# Authentik blueprint: auto-provisions the OIDC client for the homepage
# dashboard app on first boot, so there's no manual "click through the
# Authentik UI" step to get SSO working.
#
# Mounted read-only into authentik-server/authentik-worker at
# /blueprints/custom (see authentik-server.container / authentik-worker.container).
# Authentik watches this path and applies blueprints automatically.
#
# NOTE: field/model names are written against Authentik's blueprint schema as
# documented at https://docs.goauthentik.io/customize/blueprints/ for the
# version pinned in the Quadlet files (2025.8) — re-check against that
# version's schema before first real deploy, blueprint fields do shift
# between releases. (Verified against a live 2025.8.6 instance:
# `redirect_uris` is a list of {matching_mode, url} objects, not a bare
# string — an earlier draft of this file got that wrong and failed to
# apply with a "Expected a list of items but got type str" error.)
#
# The client secret is read from AUTHENTIK_HOMEPAGE_CLIENT_SECRET, which must
# be set in /var/mnt/tank/appdata/secrets/authentik.env (see
# ../../../../secrets.example/authentik.env.example). Copy that same value
# into the dashboard's own secrets file as AUTHENTIK_CLIENT_SECRET.

version: 1
metadata:
  name: homepage-dashboard-oidc

entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: homepage-oidc-provider
    identifiers:
      name: homepage-dashboard
    attrs:
      name: homepage-dashboard
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: homepage-dashboard
      client_secret: !Env AUTHENTIK_HOMEPAGE_CLIENT_SECRET
      # The redirect target is hit by the user's BROWSER, not by another
      # container — it must be whatever address the browser can actually
      # reach the dashboard at (a LAN IP/hostname), never the internal
      # Podman/Docker network name "homepage-dashboard". Since that address
      # isn't known at blueprint-authoring time (it depends on where this
      # box ends up on your LAN), this uses a regex match scoped to the
      # dashboard's fixed port+path rather than one hardcoded host. Once you
      # have a fixed hostname (e.g. a reverse-proxy domain), replace this
      # with a single `matching_mode: strict` entry for that exact URL.
      redirect_uris:
        - matching_mode: regex
          url: "^https?://[^/]+:3000/api/auth/callback/authentik$"
      sub_mode: hashed_user_id
      include_claims_in_id_token: true

  - model: authentik_core.application
    id: homepage-dashboard-app
    identifiers:
      slug: homepage-dashboard
    attrs:
      name: Homepage Dashboard
      slug: homepage-dashboard
      provider: !KeyOf homepage-oidc-provider
      meta_launch_url: "http://homepage-dashboard:3000"
