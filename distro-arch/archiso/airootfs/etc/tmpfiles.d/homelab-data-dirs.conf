# Pre-creates the directory tree the Podman Quadlets bind-mount under
# /var/mnt/tank, so containers can start immediately on every boot even
# before the real ZFS pool has been imported (Podman refuses to bind-mount a
# nonexistent host path — "statfs: no such file or directory" — rather than
# auto-creating it). Once `zpool import` mounts the real pool over this same
# path, restart the affected services (or reboot) to pick up the real
# storage: an already-running container's bind mount was set up against
# whatever was at this path when it started, so a later mount on the host
# doesn't retroactively appear inside it.
d /var/mnt/tank 0755 root root -
d /var/mnt/tank/media 0755 root root -
d /var/mnt/tank/downloads 0755 root root -
d /var/mnt/tank/appdata 0755 root root -
d /var/mnt/tank/appdata/secrets 0700 root root -
d /var/mnt/tank/appdata/sonarr 0755 root root -
d /var/mnt/tank/appdata/radarr 0755 root root -
d /var/mnt/tank/appdata/prowlarr 0755 root root -
d /var/mnt/tank/appdata/jellyseerr 0755 root root -
d /var/mnt/tank/appdata/qbittorrent 0755 root root -
d /var/mnt/tank/appdata/plex 0755 root root -
d /var/mnt/tank/appdata/authentik 0755 root root -
d /var/mnt/tank/appdata/authentik/media 0755 root root -
d /var/mnt/tank/appdata/authentik/certs 0755 root root -
d /var/mnt/tank/appdata/authentik-postgres 0755 root root -
d /var/mnt/tank/appdata/authentik-redis 0755 root root -
