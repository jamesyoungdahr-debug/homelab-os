# homelab-os Calamares configuration.
#
# Based on Calamares' own default settings.conf (see
# calamares/settings.conf upstream) — modules trimmed to what we actually
# use, and `bootloader` replaced with our own Limine shellprocess job (the
# stock `bootloader` module only supports grub/systemd-boot natively).
#
# No separate step is needed to place the Podman Quadlet files or the
# Authentik blueprint onto the target — they're just part of this live
# image's own airootfs (see airootfs/usr/share/containers/systemd/ and
# airootfs/etc/authentik/blueprints/), so `unpackfs` below already copies
# them to the target along with everything else in the live rootfs. That's
# the whole point of the Arch/archiso live-install model: the live session
# *is* the system being installed, unlike Fedora/Anaconda which reinstalls
# packages from repos onto the target.

modules-search: [ local ]

# The generic `shellprocess` module under its own id + config file — same
# mechanism Calamares' own default settings.conf documents for e.g. a
# custom-configured packagechooserq instance.
instances:
- id:       limine-bootloader
  module:   shellprocess
  config:   limine-bootloader.conf
- id:       fix-mkinitcpio
  module:   shellprocess
  config:   fix-mkinitcpio.conf
- id:       cleanup-live
  module:   shellprocess
  config:   cleanup-live.conf
- id:       generate-secrets
  module:   shellprocess
  config:   generate-secrets.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - initcpiocfg
  - shellprocess@fix-mkinitcpio
  - initcpio
  - users
  - displaymanager
  - shellprocess@cleanup-live
  - shellprocess@generate-secrets
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@limine-bootloader
  - umount
- show:
  - finished

# Using Calamares' own built-in default branding for now (generic but
# always present) rather than building custom branding — cosmetic, and not
# needed to validate that the installer actually works correctly. Revisit
# once the pipeline itself is proven.
branding: default

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
