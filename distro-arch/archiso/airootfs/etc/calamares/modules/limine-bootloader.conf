# Replaces Calamares' stock `bootloader` module, which only knows how to
# install grub or systemd-boot natively — no Limine support. This just runs
# our own script (homelab-limine-install.sh), which lands on the target
# automatically via unpackfs since it's part of the same airootfs image.
#
# dontChroot: false means this runs via `arch-chroot <rootMountPoint>`, so
# the script sees the TARGET system as its own "/" — that's what lets it
# use plain `findmnt -no UUID /` to get the target's real root UUID instead
# of needing Calamares' own GlobalStorage placeholder syntax.
---
dontChroot: false
timeout: 120
script:
    - command: "bash /usr/local/bin/homelab-limine-install.sh"
