# Copies the live session's own squashfs (the actual booted environment —
# KDE Plasma, Podman, our Quadlet files, everything already in
# packages.x86_64/airootfs) onto the target disk. This is the standard
# Arch-live-install pattern: the live medium *is* the system being
# installed, unlike Fedora/Anaconda which reinstalls packages from repos.
#
# Path confirmed against a real, working archiso profile using the same
# install_dir="arch" convention (see profiledef.sh) — this is standard
# archiso behavior, not distro-specific.
---
unpack:
    -   source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux"
        sourcefs: "file"
        destination: "/boot/vmlinuz-linux"
