# Strips the live medium's archiso-only mkinitcpio HOOKS (archiso,
# archiso_pxe_*, archiso_loop_mnt) from the target's /etc/mkinitcpio.conf.
# unpackfs copies the live squashfs verbatim, so those hooks are still
# present when this runs; they reference binaries we don't ship
# (ipconfig, nbd-client) and make mkinitcpio hard-fail on the target.
# Must run after initcpiocfg and before initcpio in settings.conf's
# sequence. dontChroot: false so it edits the TARGET's /etc/mkinitcpio.conf,
# not the live session's own.
---
dontChroot: false
timeout: 30
script:
    - command: "bash /usr/local/bin/homelab-fix-mkinitcpio.sh"
