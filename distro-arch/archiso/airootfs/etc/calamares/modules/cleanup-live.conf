# Strips live-session-only accounts/config (liveuser, its wheel-wide
# passwordless-sudo rule, SDDM autologin, the install-desktop launcher) from
# the target after unpackfs copies them there verbatim. Must run after
# displaymanager (so its SDDM config isn't clobbered by later Calamares
# writes) and dontChroot: false so it edits the TARGET, not the live session.
---
dontChroot: false
timeout: 30
script:
    - command: "bash /usr/local/bin/homelab-cleanup-live.sh"
