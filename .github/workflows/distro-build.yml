name: Build homelab OS image

on:
  push:
    branches: [master]
    paths:
      - "distro/**"
  schedule:
    # Weekly rebuild to pick up upstream Aurora/security updates.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push with BlueBuild
        uses: blue-build/github-action@v1.10
        with:
          recipe: recipe.yml
          # Repositions where the action looks for recipes/ and cosign.pub —
          # this is a monorepo shared with apps/homepage-dashboard, so the
          # actual recipe lives at distro/recipes/recipe.yml, not ./recipe.yml.
          working_directory: distro
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}

  build-iso:
    name: Generate installer ISO
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull built image
        # bootc-image-builder no longer pulls the target image itself —
        # confirmed the hard way: it fails with "image not known" otherwise,
        # even though the image was just published by the `build` job above
        # (separate jobs run on separate runners with no shared local state).
        run: sudo podman pull ghcr.io/${{ github.repository_owner }}/homelab-os:latest

      - name: Build ISO with bootc-image-builder
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --volume ./output:/output \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            ghcr.io/${{ github.repository_owner }}/homelab-os:latest

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: homelab-os-iso
          # bootc-image-builder nests output by artifact type, not flat in
          # output/ — confirmed the real path is output/bootiso/install.iso,
          # not output/*.iso (the previous glob silently matched nothing and
          # uploaded no artifact, without failing the job).
          path: output/bootiso/*.iso
          retention-days: 14
