# BlueBuild recipe for the custom homelab OS.
#
# Reference: https://blue-build.org/reference/recipe/
# NOTE: BlueBuild's module schema has changed across versions — verify module
# keys against the current docs before the first real build, this file is
# written against the schema that was current as of early 2026.

name: homelab-os
description: Atomic KDE Plasma homelab OS with ZFS support and a pre-wired self-hosted media/*arr stack
base-image: ghcr.io/ublue-os/aurora
# Pin to a specific numeric Fedora release tag before shipping — "latest" makes
# builds non-reproducible and can silently jump the kernel version out from
# under the ZFS kmod build below. e.g. image-version: "40"
image-version: latest

modules:
  # Copies distro/files/system/* into the image root. This is how the Podman
  # Quadlet unit files and the Authentik blueprint land in place.
  - type: files
    files:
      - source: system
        destination: /

  # OpenZFS's own Fedora install docs use two SEPARATE `dnf install` calls:
  # first the release RPM (which drops a .repo file + GPG key), then the
  # actual package from that new repo. That split is load-bearing, not
  # cosmetic — installing a repo-providing RPM and a package from that same
  # repo in one dnf/rpm-ostree transaction is unreliable, since repo
  # metadata isn't guaranteed to refresh mid-transaction. Two separate
  # `rpm-ostree` module entries reproduce that same split (each becomes its
  # own Containerfile RUN step).
  #
  # Earlier version of this recipe tried to do this via a custom `script`
  # module calling `rpm-ostree install` directly, both locally (WSL2 Podman)
  # and in BlueBuild's real GitHub Actions CI — both failed identically with
  # `error: This system was not booted via libostree`. Whatever makes
  # `rpm-ostree install` work in a container build, the official
  # `rpm-ostree` module below does it and a raw script calling the same
  # binary directly does not — so all package installs now go through it.
  - type: rpm-ostree
    install:
      # %OS_VERSION% is BlueBuild's magic string for the Fedora major
      # version. Verify this filename (in particular "3-1") against
      # https://openzfs.github.io/openzfs-docs/Getting%20Started/Fedora/
      # before a real build — OpenZFS bumps the release-RPM's own version
      # independently of Fedora's.
      - https://zfsonlinux.org/fedora/zfs-release-3-1.fc%OS_VERSION%.noarch.rpm

  - type: rpm-ostree
    install:
      # Plain `zfs` (not a hand-picked kmod-zfs-<version> package) so normal
      # dnf/rpm-ostree dependency resolution pulls whatever matches this
      # image's actual pinned kernel — a prebuilt kmod if OpenZFS has one for
      # it yet, otherwise zfs-dkms and its build dependencies automatically.
      - zfs
      - smartmontools      # disk health monitoring — useful with real drives behind a PERC controller
      - lm_sensors

  # Podman Quadlet units are picked up automatically from
  # /usr/share/containers/systemd at boot by podman's systemd generator, as
  # long as each unit has [Install] WantedBy=multi-user.target — no explicit
  # `systemctl enable` step is needed for those. We do still need to enable
  # the OpenZFS units explicitly.
  - type: systemd
    system:
      enabled:
        - zfs-import-cache.service
        - zfs-import-scan.service
        - zfs-mount.service
        - zfs-zed.service

  # BlueBuild's default signing module — keeps cosign image signing wired up
  # the same way the upstream Aurora image does.
  - type: signing
