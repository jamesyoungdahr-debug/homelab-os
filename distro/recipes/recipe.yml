# BlueBuild recipe for the custom homelab OS.
#
# Reference: https://blue-build.org/reference/recipe/
# NOTE: BlueBuild's module schema has changed across versions — verify module
# keys against the current docs before the first real build, this file is
# written against the schema that was current as of early 2026.

name: homelab-os
description: Atomic KDE Plasma homelab OS with ZFS support and a pre-wired self-hosted media/*arr stack
base-image: ghcr.io/ublue-os/aurora
# Pin to a specific numeric Fedora release tag before shipping — "latest" makes
# builds non-reproducible and can silently jump the kernel version out from
# under the ZFS kmod build below. e.g. image-version: "40"
image-version: latest

modules:
  # Copies distro/files/system/* into the image root. This is how the Podman
  # Quadlet unit files and the Authentik blueprint land in place.
  - type: files
    files:
      - source: system
        destination: /

  # Installs OpenZFS (+ smartmontools, lm_sensors) via plain `dnf install`.
  #
  # This went through three iterations before landing here — both raw
  # `rpm-ostree install` (in a custom script) AND BlueBuild's official
  # `rpm-ostree` module failed IDENTICALLY, in both a local WSL2
  # Podman/Buildah environment and real GitHub Actions CI, with
  # `error: This system was not booted via libostree`. rpm-ostree talks to a
  # live daemon over D-Bus backed by a real OSTree sysroot, which no
  # container build (local or CI) has. Confirmed directly that plain `dnf
  # install` — including from a URL, and installing a package from a repo
  # added by a dnf call moments earlier — works fine in the exact same
  # build context. See files/scripts/install-zfs.sh for the full story and
  # why the zfs-dkms module-build "failure" it logs is expected and harmless.
  - type: script
    scripts:
      - install-zfs.sh

  # No explicit systemd-unit-enable step needed here — confirmed directly
  # that the zfs package's own post-install scriptlet already enables
  # zfs-import-cache.service, zfs-mount.service, zfs-zed.service, and
  # zfs.target correctly on its own.

  # BlueBuild's default signing module — keeps cosign image signing wired up
  # the same way the upstream Aurora image does.
  - type: signing
